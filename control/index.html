<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020617">
<title>Taxtron Updates Admin</title>
<style>
:root{--bg:#020617;--panel:#0b1224;--line:#1e293b;--text:#e5edf9;--muted:#94a3b8;--cyan:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#10213c,var(--bg) 50%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}
header{height:68px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:21px;font-weight:850;color:var(--cyan);text-decoration:none}
a{color:var(--cyan);text-decoration:none}
main{max-width:920px;margin:auto;padding:40px 18px}
h1{font-size:32px;letter-spacing:-1px;margin:0 0 8px}
.sub{color:var(--muted);font-size:14px;line-height:1.7;margin:0 0 25px}
.panel{padding:23px;background:#0b1224e8;border:1px solid var(--line);border-radius:18px;margin-bottom:22px}
h2{font-size:17px;margin:0 0 18px}
label{display:block;color:#cbd5e1;font-size:12px;margin:13px 0 7px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #26354c;border-radius:10px;background:#060d1c;color:white;outline:none;font:inherit;font-size:14px}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
textarea{resize:vertical;min-height:90px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:750;font-size:13px}
.primary{background:linear-gradient(100deg,#0284c7,#6366f1);color:white}
.secondary{background:#17243a;color:#e2e8f0;border:1px solid var(--line)}
.danger{background:#451a24;color:#fecdd3;border:1px solid #7f1d1d}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.status{font-size:13px;color:var(--muted);line-height:1.6;margin-top:13px;overflow-wrap:anywhere}
.hidden{display:none!important}
.updaterow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 0;border-top:1px solid var(--line)}
.updateinfo{min-width:0}
.updateinfo strong{display:block;font-size:14px;overflow-wrap:anywhere}
.updateinfo small{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.pill{display:inline-block;padding:5px 8px;border-radius:7px;background:#082f49;color:#7dd3fc;font-size:10px;margin-top:8px}
</style>
</head>
<body>
<header>
  <a class="logo" href="#">TAXTRON / ADMIN</a>
</header>

<main>
  <h1>Platform Updates Manager</h1>
  <p class="sub">Publish platform releases, AI engine upgrades, and system logs to your public notification feed.</p>

  <section class="panel" id="loginPanel">
    <h2>Admin Sign In</h2>
    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button class="primary" type="submit">Sign In</button></div>
    </form>
    <div class="status" id="loginStatus">Sign in with your authorized Firebase admin credentials.</div>
  </section>

  <div id="dashboard" class="hidden">
    <section class="panel">
      <h2>🚀 Push New Update</h2>
      <form id="updateForm">
        <label for="updateCategory">Platform / Category</label>
        <select id="updateCategory" class="form-control">
            <option value="AI Engine">Taxtron AI Engine</option>
            <option value="Education">Education & Research</option>
            <option value="Music">Taxtron Music</option>
            <option value="Content">Taxtron Content</option>
            <option value="System">System Maintenance</option>
        </select>

        <label for="updateMessage">Release Notes / Message</label>
        <textarea id="updateMessage" required placeholder="Describe the new feature, tool, or fix..."></textarea>

        <div class="actions">
          <button class="primary" id="saveButton" type="submit">Publish to Network</button>
        </div>
        <div class="status" id="formStatus"></div>
      </form>
    </section>

    <section class="panel">
      <h2>Active Deployments & Updates</h2>
      <div class="status" id="listStatus">Loading updates…</div>
      <div id="updateList"></div>
    </section>

    <div class="actions" style="margin-bottom:35px">
      <button class="secondary" id="logoutButton" type="button">Sign Out</button>
    </div>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, deleteDoc, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAi0b3zJoFQBt_9izjsbJTLvQh3ZQoOpuI",
    authDomain: "taxtron-ai.firebaseapp.com",
    projectId: "taxtron-ai",
    appId: "1:1009675616284:web:27c8e67f2107d9a4255fd9"
};

// Authorized Admin UID from your setup
const ADMIN_UID = "VxlPIeqMleUaw0cXuFM9TBbuhqt2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const updatesRef = collection(db, "taxtron_updates");

const loginPanel = document.getElementById("loginPanel");
const dashboard = document.getElementById("dashboard");
const loginStatus = document.getElementById("loginStatus");
const formStatus = document.getElementById("formStatus");
const listStatus = document.getElementById("listStatus");
const updateList = document.getElementById("updateList");
const updateForm = document.getElementById("updateForm");
const saveButton = document.getElementById("saveButton");

let stopListening = null;

document.getElementById("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  loginStatus.textContent = "Signing in…";
  try {
    await signInWithEmailAndPassword(auth, document.getElementById("email").value.trim(), document.getElementById("password").value);
  } catch (error) {
    loginStatus.textContent = "Sign-in failed: " + error.message;
  }
});

onAuthStateChanged(auth, user => {
  if (stopListening) { stopListening(); stopListening = null; }
  const isAdmin = !!user && user.uid === ADMIN_UID;

  loginPanel.classList.toggle("hidden", isAdmin);
  dashboard.classList.toggle("hidden", !isAdmin);

  if (user && !isAdmin) {
    loginStatus.textContent = "This account is not authorized as the Taxtron admin.";
    signOut(auth);
    return;
  }

  if (isAdmin) {
    const q = query(updatesRef, orderBy("createdAt", "desc"));
    stopListening = onSnapshot(q, snapshot => {
      const updates = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderUpdates(updates);
      listStatus.textContent = updates.length + " active update(s) published.";
    }, error => {
      listStatus.textContent = "Couldn't load updates: " + error.message;
    });
  }
});

function renderUpdates(updates) {
  updateList.replaceChildren();
  if (!updates.length) {
    listStatus.textContent = "No active updates found.";
    return;
  }

  for (const item of updates) {
    const row = document.createElement("div");
    row.className = "updaterow";

    const info = document.createElement("div");
    info.className = "updateinfo";

    const badge = document.createElement("span");
    badge.className = "pill";
    badge.textContent = item.category || "General";

    const msg = document.createElement("strong");
    msg.textContent = item.message || "";

    info.append(badge, msg);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "danger";
    remove.textContent = "Revoke";
    remove.addEventListener("click", async () => {
      if (!confirm('Remove this update from the public feed?')) return;
      try {
        await deleteDoc(doc(db, "taxtron_updates", item.id));
      } catch (error) {
        alert("Delete failed: " + error.message);
      }
    });

    row.append(info, remove);
    updateList.appendChild(row);
  }
}

updateForm.addEventListener("submit", async event => {
  event.preventDefault();
  if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
    formStatus.textContent = "Not authorized.";
    return;
  }

  try {
    saveButton.disabled = true;
    formStatus.textContent = "Publishing update...";

    await addDoc(updatesRef, {
      category: document.getElementById("updateCategory").value,
      message: document.getElementById("updateMessage").value.trim(),
      createdAt: serverTimestamp()
    });

    updateForm.reset();
    formStatus.textContent = "Published successfully!";
  } catch (error) {
    formStatus.textContent = "Error: " + error.message;
  } finally {
    saveButton.disabled = false;
  }
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  await signOut(auth);
});
</script>
</body>
</html>
